services:
  - type: web
    name: ezbid-app
    env: node
    buildCommand: npm install && npm install --prefix backend && npm install --prefix frontend && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: ANTHROPIC_API_KEY
        sync: false
